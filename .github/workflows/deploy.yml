name: Deploy SEA-AD Viewer

on:
  push:
    branches:
      - main
    paths:
      - "code/shiny/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaad-shinyapps-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install rsconnect
        shell: Rscript {0}
        run: |
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          install.packages("rsconnect")

          stopifnot(
            requireNamespace("rsconnect", quietly = TRUE)
          )

      - name: Verify deployment bundle
        shell: bash
        run: |
          test -f code/shiny/app.R
          test -f code/shiny/manifest.json

          if grep -q "codeocean.internal" code/shiny/manifest.json; then
            echo "ERROR: manifest.json contains codeocean.internal"
            exit 1
          fi

      - name: Deploy existing shinyapps.io application
        shell: Rscript {0}
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          credentials <- Sys.getenv(
            c(
              "SHINYAPPS_NAME",
              "SHINYAPPS_TOKEN",
              "SHINYAPPS_SECRET"
            )
          )

          if (any(!nzchar(credentials))) {
            stop("One or more shinyapps.io secrets are missing.")
          }

          app_dir <- normalizePath(
            "code/shiny",
            mustWork = TRUE
          )

