name: Deploy SEA-AD Viewer

on:
  push:
    branches:
      - main
    paths:
      - "code/shiny/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaad-viewer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04

    env:
      RENV_PATHS_ROOT: ~/.cache/R/renv
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: code/shiny
          cache-version: 2

      - name: Verify restored deployment environment
        shell: Rscript {0}
        run: |
          renv::load("code/shiny")

          stopifnot(
            requireNamespace("rsconnect", quietly = TRUE),
            requireNamespace("shiny", quietly = TRUE)
          )

          cat(
            "rsconnect:",
            as.character(packageVersion("rsconnect")),
            "\n"
          )

          cat(
            "shiny:",
            as.character(packageVersion("shiny")),
            "\n"
          )

      - name: Generate deployment manifest
        shell: Rscript {0}
        run: |
          renv::load("code/shiny")
          setwd("code/shiny")

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          app_files <- c(
            "app.R",
          