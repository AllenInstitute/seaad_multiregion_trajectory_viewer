name: Deploy SEA-AD Viewer

on:
  push:
    branches:
      - main
    paths:
      - "code/shiny/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaad-viewer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04

    env:
      RENV_PATHS_ROOT: ~/.cache/R/renv
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: code/shiny
          cache-version: 2

      - name: Verify restored deployment environment
        shell: Rscript {0}
        run: |
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace("renv", quietly = TRUE)) {
            install.packages("renv")
          }

          renv::load(project = "code/shiny")

          stopifnot(
            requireNamespace("rsconnect", quietly = TRUE),
            requireNamespace("shiny", quietly = TRUE)
          )

          cat(
            "renv:",
            as.character(packageVersion("renv")),
            "\n"
          )

          cat(
            "rsconnect:",
            as.character(packageVersion("rsconnect")),
            "\n"
          )

          cat(
            "shiny:",
            as.character(packageVersion("shiny")),
            "\n"
          )

          cat(
            "Library paths:\n",
            paste(.libPaths(), collapse = "\n"),
            "\n"
          )

      - name: Generate deployment manifest
        shell: Rscript {0}
        run: |
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace("renv", quietly = TRUE)) {
            install.packages("renv")
          }

          renv::load(project = "code/shiny")
          setwd("code/shiny")

          stopifnot(
            requireNamespace("rsconnect", quietly = TRUE),
            requireNamespace("shiny", quietly = TRUE)
          )

          app_files <- c(
            "app.R",
            "abc_atlas_gene_urls.csv.gz",
            "table_column_definitions.csv",
            "renv.lock",
            list.files(
              "www",
              recursive = TRUE,
              full.names = TRUE
            )
          )

          app_files <- unique(app_files[file.exists(app_files)])

          cat(
            "Files included in deployment:\n",
            paste(app_files, collapse = "\n"),
            "\n"
          )

          rsconnect::writeManifest(
            appDir = ".",
            appFiles = app_files,
            appPrimaryDoc = "app.R",
            dependencyResolution = "strict",
            packageRepositoryResolutionR = "lax",
            verbose = TRUE
          )

          manifest_text <- paste(
            readLines(
              "manifest.json",
              warn = FALSE
            ),
            collapse = "\n"
          )

          stopifnot(
            !grepl(
              "codeocean.internal",
              manifest_text,
              fixed = TRUE
            )
          )

      - name: Verify deployment files
        shell: bash
        run: |
          test -f code/shiny/app.R
          test -f code/shiny/renv.lock
          test -f code/shiny/manifest.json
          test -f code/shiny/abc_atlas_gene_urls.csv.gz
          test -f code/shiny/table_column_definitions.csv
          test -d code/shiny/www

      - name: Deploy to Posit Connect
        uses: posit-dev/connect-actions/deploy@main
        with:
          connect-server: https://molgen-shiny.org
          connect-api-key: ${{ secrets.CONNECT_API_KEY }}
          content-guid: REPLACE_WITH_SEAAD_CONTENT_GUID
          path: code/shiny
          draft: false