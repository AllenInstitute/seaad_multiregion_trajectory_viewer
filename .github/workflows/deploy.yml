name: Deploy SEA-AD Viewer

on:
  push:
    branches: [main]
    paths:
      - "code/shiny/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaad-shinyapps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install deployment system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install and verify deployment tooling
        shell: Rscript --vanilla {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          options(timeout = 600)
          install.packages("rsconnect")
          stopifnot(
            requireNamespace("curl", quietly = TRUE),
            requireNamespace("openssl", quietly = TRUE),
            requireNamespace("rsconnect", quietly = TRUE),
            "manifestPath" %in% names(formals(rsconnect::deployApp))
          )
          cat("rsconnect:", as.character(packageVersion("rsconnect")), "\n")

      - name: Verify committed deployment manifest
        shell: Rscript --vanilla {0}
        run: |
          app_dir <- normalizePath("code/shiny", mustWork = TRUE)
          manifest_path <- file.path(app_dir, "manifest.json")
          stopifnot(file.exists(file.path(app_dir, "app.R")), file.exists(manifest_path))
          manifest <- jsonlite::fromJSON(manifest_path, simplifyVector = FALSE)
          stopifnot(identical(manifest$metadata$appmode, "shiny"))
          packages <- names(manifest$packages)
          stopifnot("shiny" %in% packages)
          files <- names(manifest$files)
          stopifnot("app.R" %in% files)
          missing <- files[!file.exists(file.path(app_dir, files))]
          if (length(missing)) stop("Manifest references missing files: ", paste(missing, collapse = ", "))
          manifest_text <- paste(readLines(manifest_path, warn = FALSE), collapse = "\n")
          if (grepl("codeocean.internal", manifest_text, fixed = TRUE)) {
            stop("Manifest contains an internal Code Ocean source. Regenerate it with public repositories.")
          }
          cat("Validated manifest with", length(packages), "packages and", length(files), "files.\n")

      - name: Deploy existing shinyapps.io application
        shell: Rscript --vanilla {0}
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          credentials <- Sys.getenv(c("SHINYAPPS_TOKEN", "SHINYAPPS_SECRET"))
          if (any(!nzchar(credentials))) stop("Missing SHINYAPPS_TOKEN or SHINYAPPS_SECRET repository secret.")
          rsconnect::setAccountInfo(
            name = "sea-ad",
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          app_dir <- normalizePath("code/shiny", mustWork = TRUE)
          
          manifest_path <- file.path(app_dir, "manifest.json")

          manifest <- jsonlite::fromJSON(
            manifest_path,
            simplifyVector = FALSE
          )
          
          # Exclude the local R startup profile from the deployment bundle.
          # This does not delete it from your repository.
          manifest$files[[".Rprofile"]] <- NULL
          
          # Refresh checksums for the actual files being deployed.
          # Preserve all recorded package versions and repository metadata.
          for (file in names(manifest$files)) {
            path <- file.path(app_dir, file)
          
            if (!file.exists(path)) {
              stop("Manifest references a missing file: ", file)
            }
          
            manifest$files[[file]]$checksum <- unname(
              tools::md5sum(path)
            )
          }
          
          jsonlite::write_json(
            manifest,
            path = manifest_path,
            auto_unbox = TRUE,
            pretty = TRUE,
            null = "null"
          )
          
          # Keep CI deployment records separate from committed local records.
          record_dir <- tempfile("seaad-deployment-records-")
          dir.create(record_dir, recursive = TRUE)

          rsconnect::deployApp(
            appDir = app_dir,
            recordDir = record_dir,
            manifestPath = file.path(app_dir, "manifest.json"),
            appId = "17663389",
            appName = "multiregion_gene_exploration",
            account = "sea-ad",
            server = "shinyapps.io",
            forceUpdate = TRUE,
            launch.browser = FALSE,
            logLevel = "normal"
          )
