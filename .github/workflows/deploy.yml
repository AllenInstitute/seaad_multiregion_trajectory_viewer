name: Deploy SEA-AD viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seaad-shinyapps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04

    env:
      APP_DIR: shiny

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
          working-directory: ${{ env.APP_DIR }}

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libuv1-dev libsnappy-dev

      - name: Restore packages and deploy
        shell: Rscript {0}
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))

          app_dir <- normalizePath(Sys.getenv("APP_DIR"))
          stopifnot(file.exists(file.path(app_dir, "app.R")))
          stopifnot(file.exists(file.path(app_dir, "renv.lock")))

          install.packages("renv")
          renv::restore(project = app_dir, prompt = FALSE)
          renv::load(project = app_dir)

          options(repos = c(CRAN = "https://cloud.r-project.org"))

          if (!requireNamespace("rsconnect", quietly = TRUE)) {
            install.packages("rsconnect")
          }

          credentials <- Sys.getenv(c(
            "SHINYAPPS_NAME",
            "SHINYAPPS_TOKEN",
            "SHINYAPPS_SECRET"
          ))
          if (any(!nzchar(credentials))) {
            stop("Missing shinyapps.io repository secrets.")
          }

          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_NAME"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          rsconnect::deployApp(
            appDir = app_dir,
            appPrimaryDoc = "app.R",
            appMode = "shiny",
            appName = "multiregion_gene_exploration",
            account = Sys.getenv("SHINYAPPS_NAME"),
            server = "shinyapps.io",
            forceUpdate = TRUE,
            launch.browser = FALSE,
            dependencyResolution = "library"
          )